name: Deploy Portfolio to OCI VM

on:
  push:
    branches:
      - main

  workflow_dispatch:

concurrency:
  group: portfolio-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - name: Install Dependencies
        run: yarn install --frozen-lockfile

      - name: Build Next.js
        run: yarn build

      - name: Prepare Standalone Build
        run: |
          cp -R public .next/standalone/public

          mkdir -p .next/standalone/.next
          cp -R .next/static .next/standalone/.next/static

          echo "Prepared deployment:"
          ls -la .next/standalone
          ls -la .next/standalone/.next

      - name: Create Deployment Archive
        run: |
          cd .next/standalone
          tar -czf ../../../portfolio-deploy.tar.gz .

      - name: Upload Deployment
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.OCI_VM_HOST }}
          username: ${{ secrets.OCI_VM_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.OCI_VM_PORT }}
          source: "portfolio-deploy.tar.gz"
          target: "/tmp"
          overwrite: true

      - name: Deploy and Restart Application
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.OCI_VM_HOST }}
          username: ${{ secrets.OCI_VM_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.OCI_VM_PORT }}
          script: |
            set -e

            echo "Deploying portfolio..."

            mkdir -p /var/www/portfolio

            cd /var/www/portfolio

            tar -xzf /tmp/portfolio-deploy.tar.gz

            rm -f /tmp/portfolio-deploy.tar.gz

            echo "Deployment extracted."

            if pm2 describe portfolio >/dev/null 2>&1; then
              echo "Restarting portfolio..."
              pm2 restart portfolio --update-env
            else
              echo "Starting portfolio..."
              pm2 start server.js --name portfolio
            fi

            pm2 save

            echo "Checking application..."

            sleep 3

            curl --fail http://127.0.0.1:3000 > /dev/null

            echo "Application is healthy."

            sudo nginx -t
            sudo systemctl reload nginx

            echo "Deployment completed successfully."