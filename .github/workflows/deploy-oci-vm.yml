name: Deploy Portfolio to OCI VM

on:
  push:
    branches:
      - main

  workflow_dispatch:

concurrency:
  group: portfolio-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - name: Install Dependencies
        run: yarn install --frozen-lockfile

      - name: Build Next.js
        run: yarn build

      - name: Prepare Standalone Build
        run: |
          cp -R public .next/standalone/public

          mkdir -p .next/standalone/.next
          cp -R .next/static .next/standalone/.next/static

          echo "Prepared standalone build:"
          du -sh .next/standalone

      - name: Create Deployment Archive
        run: |
          tar -czf portfolio-deploy.tar.gz -C .next/standalone .

          echo "Deployment archive:"
          ls -lh portfolio-deploy.tar.gz

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh

          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/oci_key
          chmod 600 ~/.ssh/oci_key

          ssh-keyscan -p ${{ secrets.OCI_VM_PORT }} \
            -H ${{ secrets.OCI_VM_HOST }} >> ~/.ssh/known_hosts

      - name: Upload Deployment Archive
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.OCI_VM_HOST }}
          username: ${{ secrets.OCI_VM_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.OCI_VM_PORT }}
          source: "portfolio-deploy.tar.gz"
          target: "/tmp"
          overwrite: true
          timeout: 60s
          command_timeout: 10m

      - name: Deploy and Restart Application
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.OCI_VM_HOST }}
          username: ${{ secrets.OCI_VM_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.OCI_VM_PORT }}
          command_timeout: 10m
          script: |
            set -e

            cd /var/www/portfolio

            echo "Extracting deployment..."
            tar -xzf /tmp/portfolio-deploy.tar.gz

            rm -f /tmp/portfolio-deploy.tar.gz

            echo "Restarting application..."

            if pm2 describe portfolio >/dev/null 2>&1; then
              pm2 restart portfolio --update-env
            else
              pm2 start server.js --name portfolio
            fi

            pm2 save

            sleep 3

            echo "Checking application..."
            curl --fail http://127.0.0.1:3000 > /dev/null

            sudo nginx -t
            sudo systemctl reload nginx

            echo "Deployment successful."