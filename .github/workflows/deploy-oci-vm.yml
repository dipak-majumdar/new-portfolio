name: Deploy Portfolio to OCI VM

on:
  push:
    branches:
      - main

  workflow_dispatch:

concurrency:
  group: portfolio-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - name: Install Dependencies
        run: yarn install --frozen-lockfile

      - name: Build Next.js
        run: yarn build

      - name: Prepare Standalone Build
        run: |
          cp -R public .next/standalone/public

          mkdir -p .next/standalone/.next
          cp -R .next/static .next/standalone/.next/static

          echo "Prepared standalone build:"
          du -sh .next/standalone

      - name: Create Deployment Archive
        run: |
          tar -czf portfolio-deploy.tar.gz -C .next/standalone .

          echo "Deployment archive:"
          ls -lh portfolio-deploy.tar.gz

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh

          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/oci_key
          chmod 600 ~/.ssh/oci_key

          ssh-keyscan -p ${{ secrets.OCI_VM_PORT }} \
            -H ${{ secrets.OCI_VM_HOST }} >> ~/.ssh/known_hosts

      - name: Upload Deployment
        run: |
          scp \
            -i ~/.ssh/oci_key \
            -P "${{ secrets.OCI_VM_PORT }}" \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o ConnectTimeout=30 \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=10 \
            portfolio-deploy.tar.gz \
            "${{ secrets.OCI_VM_USER }}@${{ secrets.OCI_VM_HOST }}:/tmp/portfolio-deploy.tar.gz"

      - name: Deploy and Restart Application
        run: |
          ssh \
            -i ~/.ssh/oci_key \
            -p "${{ secrets.OCI_VM_PORT }}" \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o ConnectTimeout=30 \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=10 \
            "${{ secrets.OCI_VM_USER }}@${{ secrets.OCI_VM_HOST }}" << 'EOF'

              set -e

              echo "Starting deployment..."

              mkdir -p /var/www/portfolio

              cd /var/www/portfolio

              echo "Extracting new build..."

              tar -xzf /tmp/portfolio-deploy.tar.gz

              rm -f /tmp/portfolio-deploy.tar.gz

              echo "Restarting Next.js..."

              if pm2 describe portfolio >/dev/null 2>&1; then
                pm2 restart portfolio --update-env
              else
                pm2 start server.js --name portfolio
              fi

              pm2 save

              echo "Waiting for application..."
              sleep 3

              echo "Running health check..."

              curl --fail --silent http://127.0.0.1:3000 > /dev/null

              echo "Next.js is healthy."

              sudo nginx -t
              sudo systemctl reload nginx

              echo "Deployment completed successfully."

          EOF