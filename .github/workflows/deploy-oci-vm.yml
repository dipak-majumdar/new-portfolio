name: Deploy Portfolio to OCI VM

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - name: Install Dependencies
        run: yarn install --frozen-lockfile

      - name: Build Next.js
        run: yarn build

      - name: Prepare Standalone Build
        run: |
          cp -R public .next/standalone/
          mkdir -p .next/standalone/.next
          cp -R .next/static .next/standalone/.next/

      - name: Upload Standalone Application
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.OCI_HOST }}
          username: ${{ secrets.OCI_USER }}
          key: ${{ secrets.OCI_SSH_KEY }}
          port: ${{ secrets.OCI_PORT }}
          source: |
            .next/standalone/*
          target: /var/www/portfolio
          strip_components: 2
          overwrite: true

      - name: Restart Application
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.OCI_HOST }}
          username: ${{ secrets.OCI_USER }}
          key: ${{ secrets.OCI_SSH_KEY }}
          port: ${{ secrets.OCI_PORT }}
          script: |
            cd /var/www/portfolio

            if pm2 describe portfolio >/dev/null 2>&1; then
              pm2 restart portfolio
            else
              pm2 start node --name portfolio -- server.js
            fi

            pm2 save

            sudo systemctl reload nginx